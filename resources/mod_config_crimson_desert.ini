# RenderDoc support mod - Crimson Desert build (MOD_TARGET_GAME=CrimsonDesert)
#
# Install: copy winhttp.dll and this file, renamed to mod_config.ini, into "Crimson Desert\bin64".
#
# Only the engine-agnostic parts of the mod exist in this build. The HZDR-only options (-attach_renderdoc
# redirect, AGS marker bridge, command list naming, pass markers) are absent or do nothing here.

[General]
LogToFile = true                    # Write mod_log.txt next to the exe.

#
# *** RENDERDOC ***
#
# Like HZDR, the game resolves D3D12CreateDevice / CreateDXGIFactory* from sl.interposer.dll (Streamline)
# at runtime, so RenderDoc never sees the device or swapchain get created unless 'BypassStreamline' is on.
#
[RenderDoc]
Enable = true                       # Load renderdoc.dll before device creation.
Diagnostics = true                  # Log module load order, IAT ownership and export resolution.
BypassStreamline = true             # Route device/factory creation around sl.interposer.dll. Disables DLSS frame generation.
DllPath = ""                        # Defaults to "C:\Program Files\RenderDoc\renderdoc.dll".
CaptureKey = 0x7A                   # Windows virtual key code (0x7A is 'F11'), handed to RenderDoc as its capture key. -1 keeps RenderDoc's F12/PrtScn.
CapturePath = ""                    # Capture file template, e.g. "C:\Captures\crimson". Leave empty to keep RenderDoc's own setting.
