# HZDR RenderDoc support mod, based on HZDR Gameplay Tweaks & Cheat Menu by Nukem
#
# Source code: https://github.com/Nukem9/hzdr-gameplay-tweaks

[General]
LogToFile = false                   # Write mod_log.txt next to the exe. Needed to read any of the RenderDoc diagnostics.

#
# *** RENDERDOC ***
#
# The game has its own RenderDoc integration behind the '-attach_renderdoc' command line flag, but it
# attaches late - after the D3D12 device already exists - so on its own it hooks nothing. Use both: keep
# 'Enable' below so the mod loads renderdoc.dll before device creation, and pass -attach_renderdoc so the
# engine's integration turns on. The engine's bare-name load resolves against the already-loaded module.
#
# If the engine's load still misses, the mod redirects it to 'DllPath' automatically.
#
# The game creates its D3D12 device and DXGI factory through sl.interposer.dll (Streamline) rather than
# through d3d12.dll/dxgi.dll. RenderDoc only hooks the latter, so without 'BypassStreamline' it never sees
# the device or swapchain get created and every capture fails with "0 device frame capturers".
#
[RenderDoc]
Enable = false                      # Let the mod load renderdoc.dll itself. Ignored when -attach_renderdoc is used.
Diagnostics = false                 # Log module load order, IAT ownership and export resolution. Needed to debug missed hooks.
BypassStreamline = false            # Route device/factory creation around sl.interposer.dll so RenderDoc can hook it. Disables DLSS frame generation.
RedirectEngineLoad = false          # If the engine's -attach_renderdoc load misses, retry it against DllPath. Only acts when the flag is present.
TranslateAgsMarkers = false         # Re-emit the engine's AMD AGS GPU markers as PIX events so RenderDoc shows frame annotations.
NameCommandLists = false            # Flip the engine's disabled debug flag so it names every D3D12 command list. Shows up in RenderDoc.
LogCommandListNames = false         # Also mirror those names into the mod log. Needs NameCommandLists.
EmitPassMarkers = false             # Wrap each command list in a named PIX scope so RenderDoc nests its draws under the pass name. Needs NameCommandLists.
WrapUnnamedLists = false            # Also scope copy/compute lists, which carry real work but never get an order name. Needs EmitPassMarkers.
DllPath = ""                        # renderdoc.dll to load. Defaults to "C:\Program Files\RenderDoc\renderdoc.dll".
CaptureKey = 0x7A                   # Windows virtual key code that captures the next frame (0x7A is 'F11'). -1 to disable. Needs a loaded renderdoc.dll.
CapturePath = ""                    # Capture file template, e.g. "C:\Captures\hzdr". Leave empty to keep RenderDoc's own setting.
